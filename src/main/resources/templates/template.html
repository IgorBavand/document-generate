<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="pt-BR">
<head>
    <title>Catálogo de Serviços</title>
    <style>
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .header img {
            max-height: 50px;
            margin-right: 20px;
        }
        .header div {
            margin-top: 20px;
        }
        .table-header {
            background-color: #BFE1FF;
            text-align: center;
            font-weight: bold;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        p {
            font-size: 16px;
            text-align: justify;
        }
        .page-break {
            page-break-before: always;
        }
        .signature-line {
            text-align: center;
            margin-top: 50px;
        }
        .signature-line hr {
            width: 200px;
            margin: 0 auto;
            border: 1px solid black;
        }
        .signature-line p {
            margin-top: 5px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <img th:src="'data:image/png;base64,' + ${logoBase64}" alt="Logo" width="180px"/><br/>
    <div th:text="${salonName}"></div>
</div>

<p th:text="'Endereço: ' + ${salonAddress}"></p>
<p th:text="'Contato: ' + ${contactInfo}"></p>

<p><strong>Catálogo de Serviços:</strong></p>

<table>
    <thead>
    <tr class="table-header">
        <th>Serviço</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th>Duração</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="service : ${services}">
        <td th:text="${service.name}"></td>
        <td th:text="${service.description}"></td>
        <td th:text="${service.price}"></td>
        <td th:text="${service.duration}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
